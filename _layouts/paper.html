---
layout: home
---

<div class="container py-4">
  <h1 class="display-4">{{ page.title }}</h1>
  {% if page.authors %}<p class="lead mb-1">{{ page.authors }}</p>{% endif %}
  {% if page.venue %}<p class="text-muted"><em>{{ page.venue }}</em>{% if page.date %} &middot; {{ page.date }}{% endif %}</p>{% endif %}
  {% if page.paperurl %}<p><a href="{{ page.paperurl }}" class="btn btn-outline-dark">Full Article</a></p>{% endif %}
  <hr>
  {{ content }}
</div>
